{% from "_brand.html" import brand_mark, icon, head_common %}
<!DOCTYPE html>
<html lang="en">
<head>
  {{ head_common() }}
  <title>Sign in · Invictus Annotate</title>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .auth { width: min(360px, 100%); }
    .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-weight: 600; font-size: var(--fs-md); }
    .auth-brand .brand-mark { width: 28px; height: 28px; }
    .auth-brand small { color: var(--fg-2); font-weight: 500; }
    .auth h1 { font-size: var(--fs-xl); margin-bottom: 4px; }
    .auth .lead { color: var(--fg-2); font-size: var(--fs-base); margin-bottom: 24px; }
    .auth form { display: flex; flex-direction: column; gap: 14px; }
    .auth .btn-lg { margin-top: 6px; }
    .auth .foot { margin-top: 28px; font-size: var(--fs-xs); color: var(--fg-3); display: flex; justify-content: space-between; }
    .caps { font-size: var(--fs-xs); color: var(--warning); display: none; }
    .caps.on { display: block; }
    #form-error:empty { display: none; }
  </style>
</head>
<body>
  <main class="auth rise">
    <div class="auth-brand">{{ brand_mark() }}<span>Invictus <small>Annotate</small></span></div>
    <h1>Sign in</h1>
    <p class="lead">Use the account your admin created for you.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required/>
        <span class="caps" id="caps">Caps Lock is on</span>
      </div>
      <div class="callout danger" id="form-error" role="alert"></div>
      <button class="btn btn-primary btn-lg" type="submit" id="submit">Sign in</button>
    </form>

    <div class="foot"><span>LAN workspace</span><span id="reason"></span></div>
  </main>

  <div id="toasts"></div>
  <script src="{{ asset('js/core.js') }}"></script>
  <script>
  (() => {
    const params = new URLSearchParams(location.search);
    const reason = params.get('reason');
    if (reason === 'expired') document.getElementById('reason').textContent = 'Your session expired — sign in again.';

    // Already signed in with a valid token? Skip the form.
    const t = IA.getToken(), u = IA.getUser(), p = t && IA.decodeJwt(t);
    if (u && p && p.exp * 1000 > Date.now() && !reason) { location.replace(destination(u)); return; }

    function destination(user) {
      if (user.must_change_password) return '/account?first=1';
      // Only same-origin paths: "/\evil.com" or "/	/evil.com" would otherwise leave the site
      try {
        const next = new URL(params.get('next') || '/home', location.origin);
        if (next.origin === location.origin && !next.pathname.startsWith('/login')) return next.pathname + next.search + next.hash;
      } catch { /* malformed → home */ }
      return '/home';
    }

    const form = document.getElementById('login-form');
    const err = document.getElementById('form-error');
    const pw = document.getElementById('password');
    pw.addEventListener('keyup', (e) => document.getElementById('caps').classList.toggle('on', e.getModifierState?.('CapsLock')));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const username = form.username.value.trim();
      const password = pw.value;
      if (!username || !password) { err.textContent = 'Enter your username and password.'; return; }
      await IA.busy(document.getElementById('submit'), async () => {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { err.textContent = IA.formatError(data); pw.select(); return; }
          IA.setSession(data);
          location.href = destination(IA.getUser());
        } catch {
          err.textContent = 'Cannot reach the server — check the connection.';
        }
      });
    });
  })();
  </script>
</body>
</html>
