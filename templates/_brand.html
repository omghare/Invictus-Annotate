{# Brand mark: a bounding box with two corner handles #}
{% macro brand_mark(cls='brand-mark') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true">
  <rect x="4.5" y="4.5" width="15" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3.2 2.3"/>
  <rect x="2.5" y="2.5" width="5" height="5" rx="1.2" fill="var(--accent)"/>
  <rect x="16.5" y="16.5" width="5" height="5" rx="1.2" fill="currentColor"/>
</svg>
{%- endmacro %}

{% macro icon(name, cls='') -%}
<svg class="i {{ cls }}" aria-hidden="true"><use href="/static/icons/sprite.svg#i-{{ name }}"/></svg>
{%- endmacro %}

{% macro head_common() -%}
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23111214'/%3E%3Crect x='5.5' y='5.5' width='13' height='13' rx='1.5' fill='none' stroke='%23edeef0' stroke-width='1.6' stroke-dasharray='3 2.2'/%3E%3Crect x='3.5' y='3.5' width='5' height='5' rx='1.2' fill='%233d8bfd'/%3E%3Crect x='15.5' y='15.5' width='5' height='5' rx='1.2' fill='%23edeef0'/%3E%3C/svg%3E"/>
<link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="{{ asset('css/tokens.css') }}"/>
<link rel="stylesheet" href="{{ asset('css/app.css') }}"/>
{%- endmacro %}
